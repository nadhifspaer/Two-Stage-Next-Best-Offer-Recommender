# local stack: api, dashboard (local mode), MLflow, Prometheus, Grafana. Run from the repository root:
#   docker compose -f docker/docker-compose.yml up --build
name: nbo

services:
  api:
    image: nbo-api:local
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    mem_limit: 500m
    ports: [ "127.0.0.1:8000:8000" ]
    volumes:
      - ../data/processed/nbo/offer_store.db:/app/data/processed/nbo/offer_store.db:ro
      - ../data/processed/models/_manifest.json:/app/data/processed/models/_manifest.json:ro
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  dashboard:
    image: nbo-dashboard:local
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    mem_limit: 500m
    environment:
      APP_MODE: local
      API_URL: http://api:8000
    ports: [ "127.0.0.1:8501:8501" ]
    volumes:
      - ../data/processed/nbo:/app/data/processed/nbo:ro
      - ../data/processed/models/_manifest.json:/app/data/processed/models/_manifest.json:ro
    # started, not healthy: the dashboard handles an API that is not yet answering (dashboard/local_mode.py)
    depends_on:
      api:
        condition: service_started

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.1
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlruns/mlflow.db --default-artifact-root /mlruns/artifacts
    ports: [ "127.0.0.1:5000:5000" ]
    volumes:
      - ../mlruns:/mlruns

  prometheus:
    image: prom/prometheus:v3.5.0
    ports: [ "127.0.0.1:9090:9090" ]
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api:
        condition: service_started

  grafana:
    image: grafana/grafana-oss:12.4.3
    ports: [ "127.0.0.1:3000:3000" ]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # development-only login, bound to 127.0.0.1; override with GRAFANA_ADMIN_USER and GRAFANA_ADMIN_PASSWORD
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-dev-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-dev-only-change-me}
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
